name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck unzip

      - name: shellcheck
        run: shellcheck android-16kb-check test/run.sh test/stubs/*

      - name: Tests
        run: test/run.sh

      # The suite stubs the toolchain, so it cannot notice that the real
      # entry point stopped being runnable. Two cheap smoke checks that it is.
      - name: Executable bit and help
        run: |
          set -euo pipefail
          test -x android-16kb-check
          ./android-16kb-check --help > /dev/null

      # The one behaviour worth asserting outside the harness: on a machine
      # with no Android toolchain at all, this must report "could not verify"
      # and not success. A checker that passes when it cannot look is the
      # thing this project exists to avoid.
      - name: Missing toolchain reports 2, not 0
        run: |
          # +e on purpose: the point of this step is to read a non-zero code,
          # and GitHub's default shell is `bash -e`.
          set +e
          ./android-16kb-check --ndk /nonexistent-ndk test/fixtures/sample.apk
          rc=$?
          set -e
          echo "exit code: $rc"
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 (could not verify), got $rc"
            exit 1
          fi

      # test/run.sh checks the JSON shape with bash alone, since neither the
      # script nor the suite may need Python. Here, where Python is to hand,
      # a few --format json runs are parsed strictly: test/check-json.py
      # rejects anything that is not exactly one JSON object, and checks the
      # envelope (field order, summary counts, verdict against exit code). The stubs stand in
      # for the toolchain, and the runner's own Android SDK is hidden so the
      # exit codes are the ones the stubs decide.
      - name: --format json output parses
        run: |
          set -euo pipefail
          export PATH="$PWD/test/stubs:$PATH" HOME="$RUNNER_TEMP"
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT BUNDLETOOL
          parse() {
            local want="$1" rc=0
            shift
            env "$@" --format json > "$RUNNER_TEMP/out.json" 2> /dev/null || rc=$?
            python3 -I test/check-json.py < "$RUNNER_TEMP/out.json"
            echo "exit $rc: $*"
            if [ "$rc" -ne "$want" ]; then
              echo "::error::expected exit $want, got $rc: $*"
              exit 1
            fi
          }
          parse 0 ./android-16kb-check test/fixtures/sample.apk
          parse 0 ./android-16kb-check test/fixtures/feature-module.aab
          parse 0 ./android-16kb-check test/fixtures/escape-names.apk
          parse 1 STUB_OBJDUMP_UNALIGNED_PATH=/feature_camera/ ./android-16kb-check test/fixtures/feature-module.aab
          parse 1 STUB_BUNDLETOOL_ALIGNED=0 ./android-16kb-check test/fixtures/sample.aab
          parse 2 ./android-16kb-check test/fixtures/only-32bit.apk
          parse 2 ./android-16kb-check --ndk /nonexistent-ndk test/fixtures/sample.apk
          parse 2 ./android-16kb-check --wat test/fixtures/sample.apk
